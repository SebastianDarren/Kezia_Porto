<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio – Create by Kezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home" aria-label="Home"><img src="assets/logo.jpg" alt="Create by Kezi"></a>
  <nav aria-label="Pages">
    <a href="#home" data-i="0">Home</a>
    <a href="#about" data-i="1">About</a>
    <a href="#project" data-i="2">Project</a>
    <a href="#contact" data-i="3">Contact</a>
  </nav>
</header>

<main class="stage" id="stage">
  <section class="slide" data-name="home" aria-label="Cover">
    <img src="assets/cover.jpg" alt="Portfolio cover">
    <button class="btn hot" style="left:60%;top:76%" data-go="1">Enter portfolio</button>
  </section>

  <section class="slide" data-name="about" aria-label="About">
    <img src="assets/about.jpg" alt="Apps developers: about me">
    <button class="btn hot" style="left:48.3%;top:61%" id="openPhoto">Meet me</button>
    <a class="tool hot" style="left:67.8%" href="https://www.adobe.com/products/photoshop.html" target="_blank" rel="noopener" data-tip="Photoshop" aria-label="Photoshop"></a>
    <a class="tool hot" style="left:74.2%" href="https://www.adobe.com/products/illustrator.html" target="_blank" rel="noopener" data-tip="Illustrator" aria-label="Illustrator"></a>
    <a class="tool hot" style="left:80.6%" href="https://www.figma.com" target="_blank" rel="noopener" data-tip="Figma" aria-label="Figma"></a>
    <a class="tool hot" style="left:87.1%" href="https://www.blender.org" target="_blank" rel="noopener" data-tip="Blender" aria-label="Blender"></a>
    <a class="tool hot" style="left:93.6%" href="https://www.canva.com" target="_blank" rel="noopener" data-tip="Canva" aria-label="Canva"></a>
  </section>

  <section class="slide" data-name="project" aria-label="UI design project">
    <img src="assets/project.jpg" alt="UI Design: Selerine digital banking app concept">
  </section>

  <section class="slide" data-name="contact" aria-label="Contact">
    <img src="assets/contact.jpg" alt="Thank you">
    <a class="link hot" style="left:34%;top:56.8%;width:32%;height:3.6%" href="mailto:createbykezia@gmail.com" aria-label="Email createbykezia@gmail.com"></a>
    <a class="link hot" style="left:36.5%;top:60.4%;width:27%;height:3.6%" href="https://www.instagram.com/vale.portofolio" target="_blank" rel="noopener" aria-label="Instagram vale.portofolio"></a>
    <button class="btn hot" style="left:0;right:0;margin:0 auto;width:fit-content;top:70%" id="copyMail">Copy email</button>
  </section>
</main>

<footer class="dock">
  <button class="arrow" id="prev" aria-label="Previous page">&#8592;</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="Next page">&#8594;</button>
</footer>

<div class="modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <div class="frame"><img src="assets/photo.jpg" alt="Portrait"><button class="btn close" data-close>Close</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
